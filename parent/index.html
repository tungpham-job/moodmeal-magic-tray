<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍👩‍👧</text></svg>">
  <title>MoodMeal — Phụ huynh</title>
  <link rel="stylesheet" href="../css/base.css?v=20261128n">
  <link rel="stylesheet" href="../css/parent.css?v=20261128n">
</head>
<body class="page-parent">
<div class="parent-layout">

  <!-- ══ APP BAR ══ -->
  <div class="app-bar">
    <div class="app-bar-brand">
      <span class="app-bar-icon">👨‍👩‍👧</span>
      <div>
        <div class="app-bar-title" id="parentName">Phụ huynh</div>
        <div class="app-bar-sub">Phụ huynh của <span id="childName">...</span></div>
      </div>
    </div>
    <button class="app-bar-logout" onclick="auth.logout()">🚪 Đăng xuất</button>
  </div>

  <!-- ══ PAGE BODY ══ -->
  <div class="page-body">

    <!-- ══════════════════════════════════
         SECTION ① — Tiến trình của con
    ══════════════════════════════════ -->
    <div>
      <div class="section-heading">📈 Tiến trình của con</div>
      <div class="p-card" id="sec1">

        <!-- Character card -->
        <div class="char-card-header">
          <div class="char-row-p">
            <div class="char-avatar-lg" id="childAvatar">🧒</div>
            <div style="flex:1">
              <div class="char-name-lg"  id="childNameCard">...</div>
              <div class="char-level-lg" id="childLevelCard">⭐ Level 2 · Người khám phá</div>
            </div>
          </div>
          <div class="xp-line">
            <span class="xp-line-label" id="childXpLabel">185 / 300 XP</span>
            <div class="xp-track-p">
              <div class="xp-fill-p" id="childXpFill" style="width:62%"></div>
            </div>
          </div>
          <div class="xp-date" id="childDate">--</div>
        </div>

        <!-- Badges -->
        <div style="padding:12px 16px 4px">
          <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">
            🏅 Danh hiệu đã đạt
          </div>
        </div>
        <div class="badges-grid" id="badgesGrid">
          <!-- rendered by JS -->
        </div>

        <!-- FAS chart -->
        <div style="border-top:1px solid var(--border-light);margin-top:4px;padding-top:4px">
          <!-- Lịch tháng: ngày con đánh giá món (bấm để xem hành trình) -->
          <div class="fas-cal" id="fasCal"></div>
          <div class="fas-day" id="fasDay"></div>
          <div class="fas-chart-parent">
            <div class="fas-bars-parent" id="fasBarsParent">
              <!-- rendered by JS -->
            </div>
            <div class="fas-axis">
              <span>FAS 1.0 — Không thích</span>
              <span>FAS 4.0 — Rất thích</span>
            </div>
            <div class="fas-fag-note" id="fasFagNote" style="display:none"></div>
          </div>
        </div>

      </div><!-- /sec1 -->
    </div>

    <!-- ══════════════════════════════════
         SECTION ② — Yêu cầu thử món của con
    ══════════════════════════════════ -->
    <div>
      <div class="section-heading">🍳 Yêu cầu thử món của con</div>
      <div class="p-card" id="requestsBox"></div>
      <div class="req-history-title">🗂️ Lịch sử yêu cầu</div>
      <div class="p-card" id="requestsHistory"></div>
    </div>

  </div><!-- /page-body -->
</div><!-- /parent-layout -->

<!-- Toast -->
<div class="p-toast" id="pToast"></div>

<!-- Scripts -->
<script src="../js/config.js?v=20261128n"></script>
<script src="../js/seed.js?v=20261128n"></script>
<script src="../js/utils.js?v=20261128n"></script>
<script src="../js/store.js?v=20261128n"></script>
<script src="../js/auth.js?v=20261128n"></script>
<script src="../js/xp.js?v=20261128n"></script>
<script src="../js/badges.js?v=20261128n"></script>
<script src="js/parent.js?v=20261128n"></script>
</body>
</html>
