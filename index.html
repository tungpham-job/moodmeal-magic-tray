<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
  <title>MOODMEAL MAGIC TRAY — Đăng nhập</title>
  <link rel="stylesheet" href="css/base.css?v=20261127w">
</head>
<body class="page-login">

  <div class="login-container">

    <!-- Logo -->
    <div class="logo-container">
      <div class="logo-icon">🍱</div>
      <h1 class="app-title">MOODMEAL MAGIC TRAY</h1>
      <p class="app-tagline">🌱 Mỗi lần thử – Một lần khám phá</p>
    </div>

    <!-- Form đăng nhập -->
    <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">

      <div class="form-group">
        <label for="username" class="form-label">Tên đăng nhập / Mã ID</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="Nhập tài khoản của bạn..."
            required
            autocomplete="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Nhập mật khẩu..."
            required
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" onclick="togglePwd(this)" title="Hiện/Ẩn mật khẩu">
            ◉
          </button>
        </div>
      </div>

      <!-- Lỗi inline -->
      <div id="errorMsg" class="error-message"></div>

      <!-- Submit -->
      <button type="submit" id="btnSubmit" class="btn-submit">Đăng Nhập</button>

    </form>

    <!-- Demo hint -->
    <div class="demo-info">
      <div class="demo-info-title">💡 Tài khoản thử nghiệm:</div>

      <div class="demo-item">
        <span class="demo-role">Ban Giám Hiệu</span>
        <code>admin / admin2026</code>
        <button class="btn-fill" onclick="fillDemo('admin','admin2026')">Dùng</button>
      </div>
      <div class="demo-item">
        <span class="demo-role">Học sinh</span>
        <code>phambaotruc / hs001</code>
        <button class="btn-fill" onclick="fillDemo('phambaotruc','hs001')">Dùng</button>
      </div>
      <div class="demo-item">
        <span class="demo-role">Phụ huynh</span>
        <code>phbaotruc / ph001</code>
        <button class="btn-fill" onclick="fillDemo('phbaotruc','ph001')">Dùng</button>
      </div>

      <div class="demo-date">
        <div class="demo-date-row">
          <span class="demo-date-label">📅 Ngày hôm nay</span>
          <input type="date" id="demoDate" onchange="setDemoDate(this.value)">
          <button type="button" class="btn-fill" id="btnRealDate" onclick="clearDemoDate()" style="display:none">Về ngày thật</button>
        </div>
        <div class="demo-reset-hint" id="demoDateNote"></div>
      </div>

      <div class="demo-reset">
        <button type="button" class="btn-reset" id="btnReset" onclick="resetDemoData()">↻ Đặt lại dữ liệu demo</button>
        <div class="demo-reset-hint">Xóa dữ liệu thử nghiệm và về ngày thật</div>
      </div>
    </div>

  </div>

  <!-- Thứ tự bắt buộc: config → seed → utils → store → auth (auth.js phải load TRƯỚC script bên dưới) -->
  <script src="js/config.js?v=20261127w"></script>
  <script src="js/seed.js?v=20261127w"></script>
  <script src="js/utils.js?v=20261127w"></script>
  <script src="js/store.js?v=20261127w"></script>
  <script src="js/auth.js?v=20261127w"></script>
  <script>

    /* Hiện lý do nếu vừa bị đăng xuất (tài khoản bị khóa, bị xóa, đổi vai trò) */
    (function showFlash() {
      const msg = sessionStore.getRaw(MM_KEYS.FLASH);
      if (!msg) return;
      sessionStore.remove(MM_KEYS.FLASH);
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.classList.add('show');
    })();

    /* Nếu đã có session hợp lệ → redirect thẳng, không hiện form */
    (function checkExistingSession() {
      const session = auth.getSession();
      if (!session) return;
      const map = { admin: 'school/index.html', student: 'student/index.html', parent: 'parent/index.html' };
      if (map[session.role]) window.location.href = map[session.role];
    })();

    /* Toggle hiện/ẩn password */
    function togglePwd(btn) {
      const el = document.getElementById('password');
      el.type = el.type === 'password' ? 'text' : 'password';
      if (btn) btn.textContent = el.type === 'password' ? '◉' : '○';   // ◉ = đang ẩn, ○ = đang hiện
    }

    /* Điền nhanh tài khoản demo */
    function fillDemo(id, pass) {
      document.getElementById('username').value = id;
      document.getElementById('password').value = pass;
      document.getElementById('errorMsg').classList.remove('show');
    }

    /* Chọn "Ngày hôm nay" để test: áp dụng ngay (lưu mm_demo_date; các trang khác đọc khi tải).
       Chọn đúng ngày thật hoặc bấm "Về ngày thật" → bỏ giả lập. */
    function realTodayStr() { return toLocalDateStr(new (window.MM_RealDate || Date)()); }

    function renderDemoDate() {
      const sim  = store.getRaw(MM_KEYS.DEMO_DATE);
      const inp  = document.getElementById('demoDate');
      const note = document.getElementById('demoDateNote');
      inp.value = sim || realTodayStr();
      document.getElementById('btnRealDate').style.display = sim ? '' : 'none';
      if (sim) {
        const d = new (window.MM_RealDate || Date)(+sim.slice(0, 4), +sim.slice(5, 7) - 1, +sim.slice(8, 10));
        const names = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const dd = ('0' + d.getDate()).slice(-2), mm = ('0' + (d.getMonth() + 1)).slice(-2);
        note.className = 'demo-date-warn';
        note.textContent = `⚠️ Hệ thống đang chạy như hôm nay là ${names[d.getDay()]}, ${dd}/${mm}/${d.getFullYear()}`;
      } else {
        note.className = 'demo-reset-hint';
        note.textContent = 'Đang dùng ngày thật của máy · chọn ngày khác để giả lập';
      }
    }

    function setDemoDate(v) {
      if (!v || v === realTodayStr()) store.remove(MM_KEYS.DEMO_DATE);
      else store.setRaw(MM_KEYS.DEMO_DATE, v);
      renderDemoDate();
    }

    function clearDemoDate() {
      store.remove(MM_KEYS.DEMO_DATE);
      renderDemoDate();
    }
    /* DEMO_MODE = false (js/config.js): bản chạy thật → bỏ khối tài khoản thử nghiệm / ngày demo / Đặt lại */
    if (MM_CONFIG.DEMO_MODE === false) {
      const demoBox = document.querySelector('.demo-info');
      if (demoBox) demoBox.remove();
    } else {
      renderDemoDate();
    }

    /* Đặt lại dữ liệu demo: chỉ xóa các khóa mm_* của MoodMeal (không đụng dữ liệu trang khác
       cùng tên miền), rồi tải lại. Tài khoản mẫu tự tạo lại ở auth.js; thực đơn, FAS mẫu
       tự tạo khi mở trang BGH → mở tab BGH trước khi demo. */
    function resetDemoData() {
      if (!confirm('Xóa toàn bộ dữ liệu demo trên trình duyệt này và tạo lại dữ liệu mẫu?')) return;
      [localStorage, sessionStorage].forEach(area => {
        Object.keys(area).filter(k => k.indexOf('mm_') === 0).forEach(k => area.removeItem(k));
      });
      mmSeedAll({ force: true });   /* hàm duy nhất ghi dữ liệu mẫu (js/seed.js) */
      const btn = document.getElementById('btnReset');
      btn.disabled = true;
      btn.textContent = '✅ Đã đặt lại';
      setTimeout(() => window.location.reload(), 600);
    }

    /* Xử lý đăng nhập */
    function handleLogin(event) {
      event.preventDefault();

      const id   = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const err  = document.getElementById('errorMsg');
      const btn  = document.getElementById('btnSubmit');

      err.classList.remove('show');
      err.textContent = '';

      /* Feedback loading */
      btn.disabled    = true;
      btn.textContent = 'Đang đăng nhập...';

      /* Giả lập async (thay bằng fetch api.gs ở production) */
      setTimeout(() => {
        const result = auth.login(id, pass);

        if (result.ok) {
          btn.textContent = '✅ Thành công! Đang chuyển trang...';
          window.location.href = result.redirect;
        } else {
          err.textContent = result.error;
          err.classList.add('show');
          btn.disabled    = false;
          btn.textContent = 'Đăng Nhập';
          document.getElementById('username').classList.add('input-error');
          document.getElementById('password').classList.add('input-error');
        }
      }, 300);
    }

    /* Xóa trạng thái lỗi khi người dùng gõ lại */
    ['username', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('input-error');
        const err = document.getElementById('errorMsg');
        err.classList.remove('show');
        err.textContent = '';
      });
    });

  </script>
</body>
</html>
