<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
  <title>Thử món – MoodMeal</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body class="page-student">
<div class="phone-frame">
  <div class="status-bar"><div class="status-notch"></div></div>

  <!-- Header -->
  <div class="screen-header header-blue">
    <h2>🍱 Bữa trưa hôm nay</h2>
    <div class="sub" id="s2Header">... · Level 2</div>
    <div class="xp-bar-wrap" style="margin-top:6px">
      <span class="xp-label" id="xpLabel">185 / 300 XP</span>
      <div class="xp-track"><div class="xp-fill" style="width:62%"></div></div>
    </div>
    <div id="dateDisplay" style="margin-top:6px;font-size:10.5px;opacity:0.85">--</div>
  </div>

  <div class="screen-content">
    <!-- Tóm tắt: hôm nay có mấy món, đã đánh giá mấy món -->
    <div class="section-label" id="evalSummary" style="padding-top:12px"></div>

    <!-- Mỗi món trong thực đơn hôm nay là một khối (do screen2.js tạo) -->
    <div id="foodList"></div>

    <div class="gap"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>Trang chủ</a>
    <a href="screen1.html" class="nav-item"><span class="nav-icon">🌍</span>Hành tinh</a>
    <a href="screen2.html" class="nav-item"><span class="nav-icon">🍱</span>Thử món</a>
    <a href="screen3.html" class="nav-item"><span class="nav-icon">🎨</span>Khay cơm</a>
  </nav>
</div>

<script src="../js/auth.js"></script>
<script src="../js/xp.js"></script>
<script src="js/nav.js"></script>
<script src="js/today.js"></script>
<script src="js/screen2.js"></script>
<script>
  const SESSION = auth.check('student');
  if (SESSION) {
    refreshXpDisplay(SESSION.userId, SESSION.name);
  }
</script>
</body>
</html>
