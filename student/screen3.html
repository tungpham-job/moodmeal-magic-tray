<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <title>Thiết kế Khay – MoodMeal</title>
  <link rel="stylesheet" href="../css/base.css?v=20261127a">
  <link rel="stylesheet" href="../css/student.css?v=20261127a">
</head>
<body class="page-student">
<div class="phone-frame">
  <div class="status-bar"><div class="status-notch"></div></div>

  <!-- Header -->
  <div class="screen-header header-purple">
    <h2>🎨 Khay cơm của em</h2>
    <div class="sub" id="s3Header">... · Level 2</div>
    <div class="xp-bar-wrap" style="margin-top:6px">
      <span class="xp-label" id="xpLabel">185 / 300 XP</span>
      <div class="xp-track"><div class="xp-fill" style="width:62%"></div></div>
    </div>
    <div id="dateDisplay" style="margin-top:6px;font-size:10.5px;opacity:0.85">--</div>
  </div>

  <div class="screen-content">
    <!-- Khay 4 ô: Tinh bột · Đạm · Rau củ · Trái cây -->
    <div class="tray-section-label">Khay hôm nay</div>
    <div class="tray-grid" id="trayGrid"></div>

    <!-- Nguyên liệu theo nhóm (dữ liệu BGH: bé đã thử hoặc mở khóa sẵn) -->
    <div class="ing-section">
      <div class="ing-tabs" id="ingTabs"></div>
      <div class="ing-grid" id="ingGrid"></div>
      <div class="ing-msg" id="trayMsg"></div>
    </div>

    <!-- Điểm khay -->
    <div class="score-section">
      <div class="score-row">
        <span class="score-label">Khay của em</span>
        <span class="score-stars" id="scoreStars" aria-hidden="true">☆☆☆☆☆</span>
      </div>
      <div class="score-row">
        <span class="score-hint" id="scoreHint" style="margin-top:0"></span>
        <span class="score-val" id="scoreVal">0 / 100</span>
      </div>
      <div class="macro-bar" id="macroBar"></div>
      <div class="macro-legend" id="macroLegend"></div>
      <button type="button" class="why-btn" id="whyBtn" onclick="toggleWhy()" aria-expanded="false">Xem vì sao ›</button>
      <div class="why-box" id="whyBox"></div>
    </div>

    <!-- Tên khay -->
    <input type="text" class="name-input" id="trayName" maxlength="40"
      placeholder="Đặt tên sáng tạo cho khay cơm... 🌈">

    <!-- Chỉ giữ nút gửi cho ba mẹ (bỏ gửi bếp trưởng) -->
    <button class="btn btn-purple" id="familyBtn" onclick="shareFamily()" style="margin-bottom:6px">
      🏠 Gửi cho ba mẹ nấu tối nay
    </button>

    <!-- Sent confirmation -->
    <div class="sent-box" id="sentBox">
      <div class="sb-icon">✅</div>
      <div class="sb-title" id="sentTitle">Đã gửi cho ba mẹ!</div>
      <div class="sb-sub"   id="sentSub">Ba mẹ sẽ nhận ngay · +10 XP 🌱</div>
    </div>

    <div class="gap"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"   class="nav-item"><span class="nav-icon">🏠</span>Trang chủ</a>
    <a href="screen1.html" class="nav-item"><span class="nav-icon">🌍</span>Hành tinh</a>
    <a href="screen2.html" class="nav-item"><span class="nav-icon">🍱</span>Thử món</a>
    <a href="screen3.html" class="nav-item"><span class="nav-icon">🎨</span>Khay cơm</a>
  </nav>
</div>

<script src="../js/config.js?v=20261127a"></script>
<script src="../js/seed.js?v=20261127a"></script>
<script src="../js/utils.js?v=20261127a"></script>
<script src="../js/store.js?v=20261127a"></script>
<script src="../js/auth.js?v=20261127a"></script>
<script src="../js/xp.js?v=20261127a"></script>
<script src="js/nav.js?v=20261127a"></script>
<script src="js/screen3.js?v=20261127a"></script>
<script>
  const SESSION = auth.check('student');
  if (SESSION) {
    refreshXpDisplay(SESSION.userId, SESSION.name);
  }
</script>
</body>
</html>
